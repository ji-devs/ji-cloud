[package]
authors = [
  "David Komer <david.komer@gmail.com>",
  "Chloe Ross <chloe@launchbadge.com>",
]
edition = "2021"
name = "ji_core"
publish = false
version = "0.1.0"

[dependencies]
anyhow = "1.0.43"
base64 = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.0"
chrono = "0.4.22"
# config = {path = "../../config/rust"}
hex = "0.4.3"
listenfd = { version = "0.3.5", optional = true }
log = "0.4.14"
reqwest = { version = "0.11.4", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.193", features = ["derive"] }
shared = { path = "../../shared/rust", features = ["backend"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
], optional = true }
yup-oauth2 = "7.0.1"
tracing = "0.1.31"
time = "0.3.37"
url = { version = "2.3.1" }

[features]
db = ["sqlx"]
